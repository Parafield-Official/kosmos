name: Release installers

on:
  push:
    tags:
      - "v*.*.*"

# A release is intentionally created only from an immutable version tag.  The
# same tagged build is signed, notarized, and published after Apple accepts it;
# this prevents a manual preflight build from creating a second Apple
# submission for the same version.  Use GitHub's "Re-run jobs" on that tagged
# run if a transient service failure needs recovery.

permissions:
  contents: read

# Keep one Kosmos release in Apple's notarization pipeline at a time. A later
# tag waits instead of creating a duplicate submission for the same team.
concurrency:
  group: kosmos-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require tags to come from main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release tags must point to a commit merged into main." >&2
            exit 1
          }

  package:
    needs: authorize
    name: Package ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # Pin the native proof engine so a tag rebuild is reproducible and can
      # be audited against one upstream source revision.
      WHISPER_CPP_COMMIT: 4834a2327d008ace3ec5a9ed00f51454bcabbc1c
      # Bump this only when a pinned native dependency or its build recipe
      # changes. Ordinary application code releases reuse the verified tools.
      NATIVE_RUNTIME_CACHE_REVISION: v1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore cached native runtime
        id: native-runtime-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            vendor/bin
            .release-cache/native
          key: kosmos-native-${{ env.NATIVE_RUNTIME_CACHE_REVISION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/markitdown_cli.py', 'vendor/bin/**') }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for Microsoft MarkItDown
        if: steps.native-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build bundled Microsoft MarkItDown helper
        if: steps.native-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            'markitdown[docx,pdf]==0.1.6' \
            'pyinstaller==6.22.2' \
            'pip-licenses==5.5.1'
          mkdir -p vendor/bin
          python -m piplicenses \
            --from=mixed \
            --format=plain-vertical \
            --with-license-file \
            --with-notice-file \
            --no-license-path \
            --output-file vendor/bin/MARKITDOWN_THIRD_PARTY_NOTICES.txt
          test -s vendor/bin/MARKITDOWN_THIRD_PARTY_NOTICES.txt
          PYINSTALLER_CONFIG_DIR="$RUNNER_TEMP/pyinstaller" \
            pyinstaller \
              --noconfirm \
              --clean \
              --onefile \
              --collect-data magika \
              --name markitdown \
              --distpath vendor/bin \
              --workpath "$RUNNER_TEMP/markitdown-build" \
              --specpath "$RUNNER_TEMP/markitdown-spec" \
              scripts/markitdown_cli.py
          chmod +x vendor/bin/markitdown* || true

      - name: Install JavaScript dependencies
        # electron-builder needs Electron's downloaded runtime in a clean
        # runner; --ignore-scripts leaves that runtime absent.
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag $tag_version does not match package.json $package_version" >&2
            exit 1
          }

      - name: Prepare macOS runtime assets
        if: runner.os == 'macOS' && steps.native-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake nasm pkg-config lame mpg123
          mkdir -p vendor/bin .release-cache/native

          # Build FFmpeg from the pinned upstream source with GPL and
          # non-free components disabled. LAME is LGPL and is bundled beside
          # the executables with an @loader_path dependency.
          ffmpeg_version='8.1.1'
          ffmpeg_archive="$GITHUB_WORKSPACE/.release-cache/native/FFmpeg-${ffmpeg_version}-source.tar.xz"
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-${ffmpeg_version}.tar.xz" -o "$ffmpeg_archive"
          tar -xf "$ffmpeg_archive" -C "$RUNNER_TEMP"
          ffmpeg_source="$RUNNER_TEMP/ffmpeg-${ffmpeg_version}"
          ffmpeg_prefix="$RUNNER_TEMP/ffmpeg-prefix"
          pushd "$ffmpeg_source"
          ./configure \
            --prefix="$ffmpeg_prefix" \
            --disable-gpl \
            --disable-nonfree \
            --disable-debug \
            --disable-doc \
            --disable-shared \
            --enable-static \
            --disable-avdevice \
            --disable-indevs \
            --disable-outdevs \
            --disable-libxcb \
            --disable-libxcb-shm \
            --disable-libxcb-xfixes \
            --disable-libxcb-shape \
            --disable-xlib \
            --disable-appkit \
            --disable-audiotoolbox \
            --disable-videotoolbox \
            --enable-libmp3lame \
            --extra-cflags="-I$(brew --prefix lame)/include" \
            --extra-ldflags="-L$(brew --prefix lame)/lib"
          make -j2
          make install
          popd
          cp "$ffmpeg_prefix/bin/ffmpeg" vendor/bin/ffmpeg
          cp "$ffmpeg_prefix/bin/ffprobe" vendor/bin/ffprobe
          for library in libmp3lame*.dylib libmpg123*.dylib; do
            source_library="$(find "$(brew --prefix lame)/lib" "$(brew --prefix mpg123)/lib" -maxdepth 1 -type f -name "$library" | head -n 1)"
            test -n "$source_library"
            cp "$source_library" "vendor/bin/$(basename "$source_library")"
          done
          for executable in vendor/bin/ffmpeg vendor/bin/ffprobe; do
            install_name_tool -add_rpath '@loader_path' "$executable"
            while IFS= read -r dependency; do
              dependency_name="$(basename "$dependency")"
              install_name_tool -change "$dependency" "@loader_path/$dependency_name" "$executable"
            done < <(otool -L "$executable" | awk '/libmp3lame|libmpg123/ {print $1}')
          done
          for library in vendor/bin/*.dylib; do
            install_name_tool -id "@loader_path/$(basename "$library")" "$library"
            while IFS= read -r dependency; do
              dependency_name="$(basename "$dependency")"
              install_name_tool -change "$dependency" "@loader_path/$dependency_name" "$library"
            done < <(otool -L "$library" | awk '/libmp3lame|libmpg123/ {print $1}')
          done
          printf '%s\n' \
            "FFmpeg ${ffmpeg_version}, built from https://ffmpeg.org/releases/ffmpeg-${ffmpeg_version}.tar.xz" \
            'License: LGPL-2.1-or-later; configure flags disable GPL and non-free components.' \
            'The matching FFmpeg source archive is attached to this GitHub Release.' \
            'LAME and mpg123: LGPL-compatible dynamic dependencies bundled beside the executables.' \
            'Sources: https://lame.sourceforge.io/ and https://www.mpg123.de/.' \
            > vendor/bin/FFMPEG_LICENSE.txt
          cp "$ffmpeg_source/COPYING.LGPLv2.1" vendor/bin/LGPL-2.1.txt
          test -s vendor/bin/LGPL-2.1.txt

          whisper_source="$RUNNER_TEMP/whisper.cpp"
          git init "$whisper_source"
          git -C "$whisper_source" remote add origin https://github.com/ggerganov/whisper.cpp.git
          git -C "$whisper_source" fetch --depth 1 origin "$WHISPER_CPP_COMMIT"
          git -C "$whisper_source" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper-build" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/whisper-build" --config Release --parallel 2
          whisper_cli="$(find "$RUNNER_TEMP/whisper-build" -type f -name whisper-cli -perm -111 | head -n 1)"
          whisper_server="$(find "$RUNNER_TEMP/whisper-build" -type f -name whisper-server -perm -111 | head -n 1)"
          test -n "$whisper_cli"
          test -n "$whisper_server"
          cp "$whisper_cli" vendor/bin/whisper-cli
          cp "$whisper_server" vendor/bin/whisper-server
          chmod +x vendor/bin/*
          printf '%s\n' \
            "FFmpeg ${ffmpeg_version}: LGPL-2.1-or-later; source archive attached to this GitHub Release." \
            'whisper.cpp: MIT, https://github.com/ggerganov/whisper.cpp' \
            'Microsoft MarkItDown and Python dependency notices: MARKITDOWN_THIRD_PARTY_NOTICES.txt' \
            > vendor/bin/THIRD_PARTY_NOTICES.txt

      - name: Prepare Windows runtime assets
        if: runner.os == 'Windows' && steps.native-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/bin
          # GitHub sets RUNNER_TEMP to a backslash path on Windows. Git Bash
          # curl/cmake die on that in seconds. GITHUB_WORKSPACE is already a
          # Unix path in this shell.
          runtime_dir="$GITHUB_WORKSPACE/.ci-runtime"
          mkdir -p "$runtime_dir"
          echo "Windows runtime staging at $runtime_dir"

          ffmpeg_release='autobuild-2026-09-01-13-13'
          ffmpeg_archive='ffmpeg-N-126386-gc27482a18d-win64-lgpl-shared.zip'
          ffmpeg_sha='4c5abe4d63748166de2c917074fcbacf52276b0cd2542ebf59b09aaa98f547f6'
          echo "Downloading $ffmpeg_archive"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/BtbN/FFmpeg-Builds/releases/download/${ffmpeg_release}/${ffmpeg_archive}" -o "$runtime_dir/${ffmpeg_archive}"
          actual_sha="$(cd "$runtime_dir" && sha256sum "$ffmpeg_archive" | awk '{print $1}')"
          actual_sha="${actual_sha#\\}"
          echo "ffmpeg sha256 expected=$ffmpeg_sha actual=$actual_sha"
          test "$ffmpeg_sha" = "$actual_sha"
          unzip -q "$runtime_dir/${ffmpeg_archive}" -d "$runtime_dir/ffmpeg-unpacked"
          ffmpeg_path="$(find "$runtime_dir/ffmpeg-unpacked" -type f -iname ffmpeg.exe | head -n 1)"
          ffprobe_path="$(find "$runtime_dir/ffmpeg-unpacked" -type f -iname ffprobe.exe | head -n 1)"
          test -n "$ffmpeg_path"
          test -n "$ffprobe_path"
          cp "$ffmpeg_path" vendor/bin/ffmpeg.exe
          cp "$ffprobe_path" vendor/bin/ffprobe.exe
          find "$(dirname "$ffmpeg_path")" -maxdepth 1 -type f -iname '*.dll' -exec cp {} vendor/bin/ \;
          printf '%s\r\n' \
            "FFmpeg ${ffmpeg_archive}, pinned to BtbN ${ffmpeg_release}." \
            "SHA-256: ${ffmpeg_sha}" \
            'License: LGPL-2.1-or-later; this asset is the BtbN LGPL build.' \
            'Corresponding FFmpeg source: https://github.com/FFmpeg/FFmpeg/tree/c27482a18d' \
            > vendor/bin/FFMPEG_LICENSE.txt

          whisper_archive='whisper-bin-x64.zip'
          whisper_url='https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-x64.zip'
          whisper_sha='49dcc16de826f20bd53d44f947a1ae49dfa81f86cad67a64d80820cb192d674a'
          echo "Downloading official whisper.cpp v1.9.2 Windows binaries"
          curl -fL --retry 3 --retry-delay 2 "$whisper_url" -o "$runtime_dir/$whisper_archive"
          actual_whisper_sha="$(cd "$runtime_dir" && sha256sum "$whisper_archive" | awk '{print $1}')"
          actual_whisper_sha="${actual_whisper_sha#\\}"
          echo "whisper zip sha256 expected=$whisper_sha actual=$actual_whisper_sha"
          test "$whisper_sha" = "$actual_whisper_sha"
          unzip -q "$runtime_dir/$whisper_archive" -d "$runtime_dir/whisper-unpacked"
          whisper_cli="$(find "$runtime_dir/whisper-unpacked" -type f -iname 'whisper-cli.exe' | head -n 1)"
          whisper_server="$(find "$runtime_dir/whisper-unpacked" -type f -iname 'whisper-server.exe' | head -n 1)"
          test -n "$whisper_cli"
          test -n "$whisper_server"
          cp "$whisper_cli" vendor/bin/whisper-cli.exe
          cp "$whisper_server" vendor/bin/whisper-server.exe
          # Official Windows zip is shared; the exe will not start without these DLLs.
          find "$(dirname "$whisper_cli")" -maxdepth 1 -type f -iname '*.dll' -exec cp {} vendor/bin/ \;
          printf '%s\r\n' \
            "FFmpeg ${ffmpeg_archive}: LGPL-2.1-or-later; source link in FFMPEG_LICENSE.txt." \
            'whisper.cpp v1.9.2 official Windows x64 binaries, MIT, https://github.com/ggml-org/whisper.cpp/releases/tag/v1.9.2' \
            'Microsoft MarkItDown and Python dependency notices: MARKITDOWN_THIRD_PARTY_NOTICES.txt' \
            > vendor/bin/THIRD_PARTY_NOTICES.txt

      - name: Verify staged native runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "mac" ]; then
            test -x vendor/bin/ffmpeg
            test -x vendor/bin/ffprobe
            test -x vendor/bin/whisper-cli
            test -x vendor/bin/whisper-server
            vendor/bin/ffmpeg -version >/dev/null
            vendor/bin/ffprobe -version >/dev/null
            vendor/bin/whisper-cli --version >/dev/null
            vendor/bin/whisper-server --help >/dev/null 2>&1
          else
            test -f vendor/bin/ffmpeg.exe
            test -f vendor/bin/ffprobe.exe
            test -f vendor/bin/whisper-cli.exe
            test -f vendor/bin/whisper-server.exe
            vendor/bin/ffmpeg.exe -version >/dev/null
            vendor/bin/ffprobe.exe -version >/dev/null
            vendor/bin/whisper-cli.exe --version >/dev/null
            vendor/bin/whisper-server.exe --help >/dev/null 2>&1
          fi
          if [ "${{ matrix.target }}" = "mac" ]; then
            test -x vendor/bin/markitdown
            vendor/bin/markitdown --help >/dev/null
          else
            test -f vendor/bin/markitdown.exe
            vendor/bin/markitdown.exe --help >/dev/null
          fi
          test -s vendor/bin/MARKITDOWN_LICENSE.txt
          test -s vendor/bin/MARKITDOWN_THIRD_PARTY_NOTICES.txt
          test -s vendor/bin/FFMPEG_LICENSE.txt
          test -s vendor/bin/THIRD_PARTY_NOTICES.txt
          npm run audit:runtime

      - name: Build renderer and core bundles
        run: npm run build

      - name: Prepare Apple notarization API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_B64"
          test -n "$APPLE_API_KEY_ID"
          apple_api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 -D > "$apple_api_key_path"
          chmod 600 "$apple_api_key_path"
          echo "APPLE_API_KEY=$apple_api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and submit the preserved macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          # Build only the signed app directory now. The afterSign hook submits
          # it once and preserves its exact bytes; DMG/ZIP creation waits until
          # Apple's ticket is available.
          npx electron-builder --mac dir --${{ matrix.arch }} --publish never

      - name: Stage matching macOS FFmpeg source
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$GITHUB_WORKSPACE/.release-cache/native/FFmpeg-8.1.1-source.tar.xz"
          test -s "$source_archive"
          test -s dist/notarization/submission.json
          test -s dist/notarization/Kosmos-signed-app.zip
          cp "$source_archive" dist/notarization/FFmpeg-8.1.1-source.tar.xz
          shasum -a 256 dist/notarization/FFmpeg-8.1.1-source.tar.xz > dist/notarization/FFmpeg-8.1.1-source.tar.xz.sha256

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          # The free direct-download channel is intentionally unsigned for
          # now. electron-updater still enforces the SHA-512 in latest.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kosmos-installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/Kosmos-*
            dist/*.blockmap
            dist/FFmpeg-*.tar.xz
            dist/FFmpeg-*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload updater metadata artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kosmos-metadata-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve signed app while Apple processes it
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kosmos-notarization-${{ github.run_id }}
          path: dist/notarization/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  notarization-status:
    name: Wait for Apple without holding a Mac runner
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node for the Apple status checker
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download preserved signed app and submission state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kosmos-notarization-${{ github.run_id }}
          path: notarization-staging

      - name: Poll the existing Apple submission
        id: notarization
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZATION_POLL_INTERVAL_SECONDS: '120'
          NOTARIZATION_POLL_TIMEOUT_MINUTES: '330'
        run: node scripts/wait-for-notarization.cjs notarization-staging/submission.json

  finalize-mac:
    name: Staple and package the accepted macOS app
    needs:
      - package
      - notarization-status
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging dependencies
        run: npm ci

      - name: Download the exact app Apple inspected
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kosmos-notarization-${{ github.run_id }}
          path: notarization-staging

      - name: Restore and staple Apple's ticket
        shell: bash
        run: |
          set -euo pipefail
          test -s notarization-staging/Kosmos-signed-app.zip
          mkdir -p dist/mac-arm64
          ditto -x -k notarization-staging/Kosmos-signed-app.zip dist/mac-arm64
          app_path="dist/mac-arm64/Kosmos.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          stapled='false'
          for attempt in 1 2 3 4; do
            if xcrun stapler staple "$app_path"; then
              stapled='true'
              break
            fi
            sleep "$((attempt * 15))"
          done
          test "$stapled" = 'true'
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Create final DMG, ZIP, and updater metadata
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          app_path="dist/mac-arm64/Kosmos.app"
          npx electron-builder \
            --mac dmg zip \
            --arm64 \
            --prepackaged "$app_path" \
            --publish never
          dmg_files=(dist/Kosmos-*-mac-arm64.dmg)
          zip_files=(dist/Kosmos-*-mac-arm64.zip)
          test "${#dmg_files[@]}" -eq 1
          test "${#zip_files[@]}" -eq 1
          test -s dist/latest-mac.yml
          cp notarization-staging/FFmpeg-8.1.1-source.tar.xz dist/FFmpeg-8.1.1-source.tar.xz
          cp notarization-staging/FFmpeg-8.1.1-source.tar.xz.sha256 dist/FFmpeg-8.1.1-source.tar.xz.sha256

      - name: Upload final macOS installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kosmos-installer-mac-arm64
          path: |
            dist/Kosmos-*
            dist/*.blockmap
            dist/FFmpeg-*.tar.xz
            dist/FFmpeg-*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload final macOS updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kosmos-metadata-mac-arm64
          path: dist/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - package
      - finalize-mac
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
          pattern: kosmos-installer-*

      - name: Download updater metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
          pattern: kosmos-metadata-*

      - name: Create checksums
        working-directory: release-artifacts
        run: |
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-artifacts/*

  pages-build:
    name: Prepare website and update feed
    needs:
      - package
      - finalize-mac
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Pages release dependencies
        # The feed generator parses electron-updater YAML metadata.  Keep this
        # install script-free so a Pages-only deployment never downloads or
        # executes Electron binaries.
        run: npm ci --ignore-scripts

      - name: Install Lightbox website dependencies
        run: npm ci
        working-directory: website

      - name: Download installer metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
          pattern: kosmos-metadata-*

      - name: Build Lightbox website and prepare public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix website
          mkdir -p pages-site
          cp -R website-dist/. pages-site/
          touch pages-site/.nojekyll
          node scripts/prepare-pages-release.cjs \
            release-artifacts \
            pages-site \
            "$GITHUB_REF_NAME"
          test -s pages-site/updates/latest.yml
          test -s pages-site/updates/latest-mac.yml
          test -s pages-site/updates/downloads.json
          if find pages-site -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo 'Installers must remain GitHub Release assets, not Pages files.' >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-site

  pages:
    name: Deploy website and update feed
    needs:
      - publish
      - pages-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

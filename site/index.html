<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kosmos — Stop paying three tools to finish one book</title>
  <meta name="description" content="Free app for authors and narrators. Check the recording against the book. Export files Audible will take. The book stays on this computer." />
  <link rel="icon" type="image/png" href="assets/kosmos-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #fafafa;
      --muted: #a7a6a6;
      --nav: #b6b5b5;
      --strip: #8b8a8a;
      --pill: #ffffff;
      --pill-ink: #050505;
      --u: calc(100vh / 1058);
      --uw: calc(100vw / 1487);
      --h: clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
    }
    @supports (height: 100dvh) {
      :root { --u: calc(100dvh / 1058); }
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
      color: var(--ink);
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

    .stage { position: relative; width: 100%; height: 100%; background: #050505; }

    .plate { position: absolute; inset: 0; overflow: hidden; }
    .plate-video {
      position: absolute;
      left: 50%;
      top: calc(1 * var(--u));
      width: calc(1492 * var(--u));
      height: calc(1054 * var(--u));
      transform: translateX(calc(-50% - calc(0.5 * var(--u))));
      object-fit: cover;
      pointer-events: none;
    }
    .plate::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom,
          rgba(5,5,5,0) 78.8%, rgba(5,5,5,.23) 79.6%, rgba(5,5,5,.45) 81.4%,
          rgba(5,5,5,.75) 83.3%, rgba(5,5,5,.84) 85.2%, rgba(5,5,5,.888) 88%,
          rgba(5,5,5,.905) 91%, rgba(5,5,5,.96) 95%, #050505 100%),
        linear-gradient(to right,
          #050505 calc(50% - 746 * var(--u)),
          transparent calc(50% - 676 * var(--u)),
          transparent calc(50% + 676 * var(--u)),
          #050505 calc(50% + 746 * var(--u)));
    }

    .topbar {
      position: absolute;
      top: calc(16 * var(--u));
      left: calc(50 * var(--u));
      right: calc(50 * var(--u));
      height: calc(72 * var(--u));
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 calc(12 * var(--u)) 0 calc(24 * var(--u));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(12,12,13,.48);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 16px 42px rgba(0,0,0,.2);
      backdrop-filter: blur(20px) saturate(135%);
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }

    .brand {
      position: relative;
      grid-column: 2;
      grid-row: 1;
      justify-self: center;
      width: calc(92 * var(--u));
      height: calc(58 * var(--u));
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 999px;
      background: linear-gradient(165deg, rgba(92,88,94,.96), rgba(36,32,38,.97));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.64),
        inset 0 -1px 0 rgba(255,255,255,.13),
        0 7px 20px rgba(0,0,0,.28);
    }
    .brand::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.08), transparent 48%);
      pointer-events: none;
    }
    .brand img {
      position: relative;
      width: calc(48 * var(--u));
      height: auto;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.32));
    }
    .brand:hover { border-color: rgba(255,255,255,.76); }

    .links {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
      display: flex;
      font-size: calc(19.0 * var(--u));
      font-weight: 400;
      color: var(--nav);
      white-space: nowrap;
    }
    .links a + a { margin-left: calc(24.5 * var(--u)); }
    .links a:nth-child(3) { margin-left: calc(23.5 * var(--u)); }
    .links a:nth-child(4) { margin-left: calc(26.0 * var(--u)); }
    .links a:hover { color: var(--ink); }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--pill);
      color: var(--pill-ink);
      border-radius: 999px;
      font-weight: 500;
    }
    .pill span { transform: translateY(calc(1 * var(--u))); }
    .pill-nav {
      position: relative;
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      width: calc(175 * var(--u));
      height: calc(49 * var(--u));
      font-size: calc(20.6 * var(--u));
    }

    .burger {
      display: none;
      position: absolute;
      right: calc(22 * var(--u));
      top: calc(22 * var(--u));
      width: calc(49 * var(--u));
      height: calc(49 * var(--u));
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(16px);
    }
    .burger i {
      position: absolute;
      left: 30%;
      right: 30%;
      height: 1.5px;
      background: #fff;
      transition: transform .32s cubic-bezier(.22, 1, .36, 1);
    }
    .burger i:first-child { top: calc(50% - 4.3px); }
    .burger i:last-child { top: calc(50% + 4.3px); }
    .is-open .burger i:first-child { transform: translateY(4.3px) rotate(45deg); }
    .is-open .burger i:last-child { transform: translateY(-4.3px) rotate(-45deg); }

    .menu {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: none;
      background:
        linear-gradient(180deg, rgba(5,5,5,.42), rgba(5,5,5,.92)),
        rgba(5,5,5,.66);
      backdrop-filter: blur(22px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .42s ease, visibility .42s ease;
    }
    .menu-inner { padding: 110px 28px 40px; }
    .menu-eyebrow {
      margin: 0 0 16px;
      color: var(--strip);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 12px;
    }
    .menu-list { list-style: none; margin: 0; padding: 0; }
    .menu-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: max(25px, calc(31 * var(--u)));
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .menu-list a::after { content: "›"; color: var(--muted); }
    .menu-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      align-items: center;
      margin-top: 28px;
    }
    .menu-foot .pill { width: 175px; height: 50px; font-size: 18px; }

    .hero { position: absolute; inset: 0; pointer-events: none; }
    .hero a { pointer-events: auto; }

    .headline {
      position: absolute;
      left: calc(75.5 * var(--u));
      top: calc(230.5 * var(--u));
      margin: 0;
      font-size: calc(71.6 * var(--h));
      line-height: calc(80.5 * var(--h));
      font-weight: 400;
      letter-spacing: calc(0.3 * var(--h));
      color: var(--ink);
      white-space: nowrap;
    }
    .headline span { display: block; }

    .sub {
      position: absolute;
      left: calc(75.5 * var(--u));
      top: calc(230.5 * var(--u) + 189.0 * var(--h));
      margin: 0;
      font-size: calc(20.7 * var(--h));
      line-height: calc(23.5 * var(--h));
      font-weight: 400;
      word-spacing: calc(1.8 * var(--h));
      color: var(--muted);
    }
    .sub span { display: block; white-space: nowrap; }

    .actions { position: absolute; inset: 0; pointer-events: none; }
    .actions a { pointer-events: auto; }

    .pill-cta {
      position: absolute;
      left: calc(74.9 * var(--u));
      top: calc(230.5 * var(--u) + 264.5 * var(--h));
      width: calc(175.6 * var(--h));
      height: calc(50 * var(--h));
      gap: calc(10 * var(--h));
      font-size: calc(18.6 * var(--h));
    }
    .pill-cta svg { width: calc(21 * var(--h)); height: calc(21 * var(--h)); fill: currentColor; }
    .pill-windows {
      left: calc(74.9 * var(--u) + 193.6 * var(--h));
      color: #fff;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
    }
    .ghost {
      position: absolute;
      left: calc(74.9 * var(--u) + 220.6 * var(--h));
      top: calc(230.5 * var(--u) + 279.5 * var(--h));
      font-size: calc(20.6 * var(--h));
      font-weight: 500;
      letter-spacing: calc(0.12 * var(--h));
      color: #fff;
    }

    .logos {
      position: absolute;
      width: calc(820 * var(--u));
      left: 50%;
      transform: translateX(-50%);
      height: calc(1058 * var(--u));
      color: #c2c1c1;
      pointer-events: none;
    }
    .lg {
      position: absolute;
      display: flex;
      align-items: center;
      gap: calc(11 * var(--u));
      top: calc(928 * var(--u));
    }
    .lg svg {
      width: calc(24 * var(--u));
      height: calc(24 * var(--u));
      display: block;
      flex: none;
    }
    .lg .w {
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: calc(16 * var(--u));
      letter-spacing: 0.04em;
      color: #c2c1c1;
      white-space: nowrap;
    }
    .lg1 { left: calc(8 * var(--u)); }
    .lg2 { left: calc(198 * var(--u)); }
    .lg3 { left: calc(448 * var(--u)); }
    .lg4 { left: calc(638 * var(--u)); }

    @media (prefers-reduced-motion: no-preference) {
      .brand, .pill-nav { animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
      .links { animation: riseNav .8s cubic-bezier(.22,1,.36,1) both; }
      .headline { animation: rise .9s cubic-bezier(.22,1,.36,1) .06s both; }
      .sub { animation: rise .9s cubic-bezier(.22,1,.36,1) .14s both; }
      .pill-cta, .ghost { animation: rise .9s cubic-bezier(.22,1,.36,1) .22s both; }
      .lg { animation: fade 1.1s ease .34s both; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(calc(14 * var(--u))); }
    }
    @keyframes riseNav {
      from { opacity: 0; transform: translateY(calc(14 * var(--u))); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fade { from { opacity: 0; } }

    @media (max-aspect-ratio: 11/10) {
      :root { --m: min(100vw / 430, 1.34px); --u: var(--m); }
      html, body { overflow: hidden; }
      .links, .pill-nav { display: none; }
      .burger { display: block; }
      .menu { display: block; }
      .is-open .menu { opacity: 1; visibility: visible; }
      .topbar {
        top: 12px;
        left: 14px;
        right: 14px;
        height: 64px;
        padding: 0 10px 0 18px;
      }
      .brand { width: 84px; height: 52px; transform: none; }
      .brand img { width: 44px; }
      .burger { grid-column: 3; grid-row: 1; justify-self: end; }
      .headline {
        left: 22px; right: 22px; top: 168px;
        white-space: normal;
        font-size: 40px;
        line-height: 46px;
      }
      .headline span { display: inline; }
      .headline span + span::before { content: " "; }
      .sub {
        left: 22px; right: 22px;
        top: auto;
        bottom: 210px;
      }
      .sub span { white-space: normal; display: inline; }
      .actions {
        inset: auto 22px 138px;
        height: 50px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .pill-cta, .pill-windows {
        position: relative;
        left: auto;
        top: auto;
        bottom: auto;
        width: 100%;
        height: 50px;
      }
      .logos {
        width: auto; left: 22px; right: 22px; transform: none;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px 12px;
        height: auto;
        bottom: 28px;
        top: auto;
      }
      .lg {
        position: relative;
        left: auto !important;
        top: auto !important;
        min-height: 0;
      }
      .lg .w { position: static; left: auto; top: auto; }
      .plate-video {
        left: 0; top: 0; width: 100%; height: 100%;
        transform: none;
        object-fit: cover;
        object-position: 43% center;
      }
      .plate::after {
        background:
          linear-gradient(to right, rgba(5,5,5,.86), rgba(5,5,5,.66) 42%, rgba(5,5,5,.20) 78%, rgba(5,5,5,.10)),
          linear-gradient(to bottom, rgba(5,5,5,.72), rgba(5,5,5,.34) 24%, rgba(5,5,5,.34) 56%, rgba(5,5,5,.80) 82%, rgba(5,5,5,.97) 94%, #050505);
      }
    }
    @media (min-width: 600px) and (max-aspect-ratio: 11/10) {
      :root { --m: min(100vw / 860, 100vh / 760, 1.25px); --u: var(--m); }
      .headline { white-space: nowrap; font-size: calc(52 * var(--h)); }
      .headline span { display: block; }
      .headline span + span::before { content: none; }
      .logos {
        display: flex;
        justify-content: space-between;
        grid-template-columns: none;
      }
      .plate-video { object-position: 44% center; }
      .plate::after {
        background:
          linear-gradient(to right, rgba(5,5,5,.84), rgba(5,5,5,.60) 42%, rgba(5,5,5,.16) 78%, rgba(5,5,5,.06)),
          linear-gradient(to bottom, rgba(5,5,5,.66), rgba(5,5,5,.28) 24%, rgba(5,5,5,.30) 56%, rgba(5,5,5,.78) 82%, rgba(5,5,5,.96) 94%, #050505);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand, .links, .pill-nav, .headline, .sub, .pill-cta, .ghost, .lg { animation: none; }
      .menu, .burger i { transition-duration: 0.001s; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="plate">
      <video class="plate-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
      </video>
    </div>

    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Kosmos home">
        <img src="assets/kosmos-mark.png" alt="" width="400" height="289" />
      </a>
      <nav class="links" aria-label="Primary">
        <a href="about.html">About</a>
        <a href="features.html">Features</a>
        <a href="compare.html">Compare</a>
        <a href="faq.html">FAQ</a>
      </nav>
      <a class="pill pill-nav" href="download.html"><span>Download</span></a>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
        <i></i><i></i>
      </button>
    </header>

    <nav class="menu" id="menu" aria-hidden="true" aria-label="Menu">
      <div class="menu-inner">
        <p class="menu-eyebrow">Menu</p>
        <ul class="menu-list">
          <li><a href="about.html">About</a></li>
          <li><a href="features.html">Features</a></li>
          <li><a href="compare.html">Compare</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
        <div class="menu-foot">
          <a class="pill" href="download.html"><span>Download</span></a>
          <a class="ghost" href="https://github.com/Parafield-Official/kosmos">View on GitHub</a>
        </div>
      </div>
    </nav>

    <main class="hero">
      <h1 class="headline"><span>Stop paying three tools</span> <span>to finish one book.</span></h1>
      <p class="sub">
        <span>Free app for authors and narrators.</span>
        <span>Proofread the recording. Export files Audible will take.</span>
      </p>
      <div class="actions">
        <a class="pill pill-cta" href="download.html#mac" aria-label="Download Kosmos for Mac">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09M12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25"/></svg>
          <span>Mac</span>
        </a>
        <a class="pill pill-cta pill-windows" href="download.html#windows" aria-label="Download Kosmos for Windows">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.1 10.5 4v7.2H3V5.1Zm8.4-1.25L21 2.5v8.7h-9.6V3.85ZM3 12.1h7.5v7.2L3 18.2v-6.1Zm8.4 0H21v8.7l-9.6-1.35V12.1Z"/></svg>
          <span>Windows</span>
        </a>
      </div>
    </main>

    <div class="logos" aria-label="What you keep">
      <div class="lg lg1">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="12.5" rx="2.2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8 20.2h8M12 17v3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span class="w">Offline</span>
      </div>
      <div class="lg lg2">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9.2" cy="12" r="5.4" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="14.8" cy="12" r="5.4" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span class="w">Open source</span>
      </div>
      <div class="lg lg3">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3.6c-3.3 0-6 2.55-6 5.7 0 4.35 6 11.1 6 11.1s6-6.75 6-11.1c0-3.15-2.7-5.7-6-5.7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="12" cy="9.2" r="1.85" fill="currentColor"/>
        </svg>
        <span class="w">Local</span>
      </div>
      <div class="lg lg4">
        <span class="w">$0</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var stage = document.querySelector(".stage");
      var burger = document.getElementById("burger");
      var menu = document.getElementById("menu");
      function setOpen(open) {
        stage.classList.toggle("is-open", open);
        burger.setAttribute("aria-expanded", open ? "true" : "false");
        burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        menu.setAttribute("aria-hidden", open ? "false" : "true");
      }
      burger.addEventListener("click", function () {
        setOpen(!stage.classList.contains("is-open"));
      });
      menu.addEventListener("click", function (e) {
        if (e.target.closest("a")) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
      window.addEventListener("resize", function () {
        if (window.innerWidth / Math.max(1, window.innerHeight) > 1.1) setOpen(false);
      });
    })();
  </script>
</body>
</html>

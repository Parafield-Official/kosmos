name: Pull request checks

on:
  pull_request:
    branches:
      - Lightbox-Interface
  push:
    branches:
      - Lightbox-Interface

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run test suite
        run: npm test
